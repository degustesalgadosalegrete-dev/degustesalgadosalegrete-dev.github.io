<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Deguste — Confeitaria Artesanal">
  <defs>
    <radialGradient id="red" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#A32B2B"/>
      <stop offset="62%" stop-color="#7E1A1A"/>
      <stop offset="100%" stop-color="#5E1010"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C97A"/>
      <stop offset="55%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#B47F26"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF1DC"/>
      <stop offset="100%" stop-color="#EFDFBE"/>
    </linearGradient>
    <linearGradient id="brown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A3520"/>
      <stop offset="50%" stop-color="#7B4A2C"/>
      <stop offset="100%" stop-color="#4A2A19"/>
    </linearGradient>
  </defs>

  <!-- moldura decorativa externa -->
  <g fill="none" stroke="url(#brown)" stroke-width="5" stroke-linecap="round">
    <path d="M60 84 C40 60 44 34 70 26"/>
    <path d="M260 84 C280 60 276 34 250 26"/>
    <path d="M60 236 C40 260 44 286 70 294"/>
    <path d="M260 236 C280 260 276 286 250 294"/>
  </g>
  <g fill="url(#brown)" opacity="0.9">
    <circle cx="72" cy="30" r="5"/>
    <circle cx="248" cy="30" r="5"/>
    <circle cx="72" cy="290" r="5"/>
    <circle cx="248" cy="290" r="5"/>
  </g>

  <!-- óvalo principal -->
  <ellipse cx="160" cy="160" rx="146" ry="122" fill="url(#brown)"/>
  <ellipse cx="160" cy="160" rx="136" ry="112" fill="url(#red)"/>
  <ellipse cx="160" cy="160" rx="128" ry="104" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.85"/>

  <!-- trigo (esquerda e direita) -->
  <g stroke="url(#gold)" stroke-width="2.6" fill="none" opacity="0.95">
    <path d="M96 214 C88 190 88 166 96 144"/>
    <path d="M96 200 l-11 -9 M96 186 l-11 -9 M96 172 l-11 -9 M96 158 l-11 -9"/>
    <path d="M224 214 C232 190 232 166 224 144"/>
    <path d="M224 200 l11 -9 M224 186 l11 -9 M224 172 l11 -9 M224 158 l11 -9"/>
  </g>

  <!-- três salgados dourados -->
  <g>
    <path d="M116 214 C116 194 130 180 148 180 C166 180 180 194 180 214 Z" fill="url(#gold)"/>
    <path d="M140 214 C140 196 152 184 166 184 C182 184 194 196 194 214 Z" fill="url(#gold)" opacity="0.92"/>
    <path d="M158 216 C158 200 168 190 180 190 C193 190 204 201 204 216 Z" fill="url(#gold)" opacity="0.85"/>
    <ellipse cx="160" cy="222" rx="52" ry="9" fill="#F2A94D" opacity="0.45"/>
  </g>

  <!-- "Deguste" em script -->
  <text x="160" y="150" text-anchor="middle"
        font-family="'Snell Roundhand','Segoe Script','Brush Script MT','Lucida Calligraphy',cursive"
        font-size="66" font-weight="700" fill="url(#cream)" letter-spacing="1">Deguste</text>

  <!-- linhas finas sob o nome -->
  <g stroke="url(#cream)" stroke-width="1.8" opacity="0.75">
    <line x1="78" y1="163" x2="242" y2="163"/>
    <line x1="92" y1="170" x2="228" y2="170"/>
  </g>

  <!-- pequenas espigas acima dos salgados -->
  <g stroke="url(#cream)" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M150 178 l-5 -10 M150 178 l4 -10 M160 176 l0 -11"/>
  </g>
</svg>
